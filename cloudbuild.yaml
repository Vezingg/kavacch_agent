steps:
  # Build the unified Agent image (FastWorkflow + CloudApp)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/kavacch-agent-lite-491904/kalash-repo/kalash-agent:latest'
      - '-f'
      - 'Dockerfile.agent'
      - '.'
    timeout: 1800s

  # Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/kavacch-agent-lite-491904/kalash-repo/kalash-agent:latest'
    timeout: 600s

images:
  - 'asia-south1-docker.pkg.dev/kavacch-agent-lite-491904/kalash-repo/kalash-agent:latest'

timeout: 2400s

options:
  machineType: 'E2_HIGHCPU_8'
